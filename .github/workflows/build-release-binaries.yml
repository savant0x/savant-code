name: Build and Publish Release Binaries

# Trigger when a release is published (not drafts).
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub release tag to build and upload (for example v0.0.17)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-binary:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Build every platform even if one fails so we can see all failures.
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            bun-target: bun-linux-x64
            binary: savant-code
          - target: linux-arm64
            # Cross-compile ARM64 from an x64 runner so we don't depend on the
            # public-beta ARM GitHub runners.
            os: ubuntu-latest
            platform: linux
            arch: arm64
            bun-target: bun-linux-arm64
            binary: savant-code
          - target: darwin-x64
            os: macos-13
            platform: darwin
            arch: x64
            bun-target: bun-darwin-x64
            binary: savant-code
          - target: darwin-arm64
            os: macos-latest
            platform: darwin
            arch: arm64
            bun-target: bun-darwin-arm64
            binary: savant-code
          - target: win32-x64
            os: windows-latest
            platform: win32
            arch: x64
            bun-target: bun-windows-x64
            binary: savant-code.exe

    steps:
      - name: Resolve release tag
        id: release-tag
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${INPUT_RELEASE_TAG:-$EVENT_RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            echo "A release tag is required." >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-tag.outputs.TAG }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Restore dependencies cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract version from tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.TAG }}
        run: |
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        working-directory: cli
        env:
          # Release binaries must run in production mode. SAVANT_CODE_BUILD_ENV
          # lets dev builds opt out; in CI we always want prod.
          NEXT_PUBLIC_CB_ENVIRONMENT: prod
          # Pin the build target so the native runner architecture does not
          # accidentally influence which binary is produced.
          OVERRIDE_TARGET: ${{ matrix.bun-target }}
          OVERRIDE_PLATFORM: ${{ matrix.platform }}
          OVERRIDE_ARCH: ${{ matrix.arch }}
        run: |
          bun run scripts/build-binary.ts savant-code "${{ steps.version.outputs.VERSION }}"

      - name: Smoke test binary
        shell: bash
        run: |
          ./cli/bin/${{ matrix.binary }} --version

      - name: Package tarball
        shell: bash
        run: |
          cd cli/bin
          tar -czf "savant-code-${{ matrix.target }}.tar.gz" "${{ matrix.binary }}" tree-sitter.wasm env.json

      - name: Upload to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release-tag.outputs.TAG }}" "cli/bin/savant-code-${{ matrix.target }}.tar.gz" --clobber

# Note: baseline AVX2 fallbacks (linux-x64-baseline, win32-x64-baseline) are
# not yet built because the current build script does not produce them. Add a
# baseline build step once Bun supports a baseline target flag or the build
# script is extended to emit non-AVX2 binaries.
