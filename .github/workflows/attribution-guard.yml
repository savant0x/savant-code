# Agent-attribution guard (CI layer).
#
# RULE (operator, 2026-10-14, verbatim): "it's 100% forbidden from any coding
# agent to tag my repo". The local commit-msg hook and the pre-push range scan
# can both be skipped with `--no-verify` — that is git, not a policy choice — so
# this workflow is the layer that cannot be skipped from a clone, and it is the
# one the operator should mark REQUIRED in branch protection: a red check only
# blocks a merge when the repository requires it.
#
# It scans EVERY reachable commit message AND the governed documents in the
# checkout with the same single-source rule the hooks use
# (scripts/attribution-guard.ts), so a watermarked commit that arrived without a
# hook — or was force-pushed into a branch — fails here, and so does agent
# credit inside the records themselves (FID-2026-1016-008).
#
# Scope note: this job reads commit messages and document text. It never mutates
# history, and it deliberately does not decide renames or authorship — any
# commit or record created by a human, a script or a CI bot is judged solely on
# whether a FOREIGN AGENT is credited (Savant's own credit is lawful).

name: attribution-guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-agent-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the scan judges every reachable commit, not just the
          # tip, so a shallow clone would silently shrink the evidence.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Scan commit history for agent attribution
        run: bun scripts/attribution-guard.ts --all

      # `dev/` is gitignored and absent from a clone, so this step covers the
      # tracked trees (docs/, CHANGELOG.md and the other root records); the
      # local gate covers the whole governed set, dev/ included.
      - name: Scan governed documents for agent attribution
        run: bun scripts/attribution-guard.ts --documents
