# Protocol Config — Project-specific configuration for ECHO Protocol
#
# QUICK START: Change these 3 lines for your project:
#   1. language:       "rust" | "typescript" | "python" | "go" | "java" | "csharp"
#   2. commands.build: your compile/build command
#   3. commands.test:  your test runner command

project:
  name: 'savant-code'
  description: 'Multi-Agent AI Coding Assistant with ECHO Protocol governance. TypeScript monorepo, Bun runtime.'
  version: '0.0.26'

protocol:
  version: '0.2.0'
  strict_mode: true # true = all 15 laws active (default), false = core 4 laws only

language: 'typescript' # rust | typescript | python | go | java | csharp

commands:
  build: 'bun run ci' # NOTE: release-artifact build (SDK + Savant-Free binaries only, per package.json `ci`). Full 9-workspace compile verification is the `type_check` gate below.
  test: 'bun run test' # Root `test` script — chains all workspace unit suites, including design-systems. Matches the `type_check` gate coverage.
  # Mirrors the root `typecheck` script — all workspaces including the
  # design-systems package and packages/database + packages/knowledge-graph.
  type_check: 'bun run --cwd=common typecheck && bun run --cwd=agents typecheck && bun run --cwd=sdk typecheck && bun run --cwd=cli typecheck && bun run --cwd=evals typecheck && bun run --cwd=packages/agent-runtime typecheck && bun run --cwd=packages/design-systems typecheck && bun run --cwd=packages/code-map typecheck && bun run --cwd=packages/database typecheck && bun run --cwd=packages/knowledge-graph typecheck && bun run --cwd=packages/llm-providers typecheck'
  lint: 'bun x eslint . --max-warnings 0' # zero-tolerance gate (matches .githooks/pre-push)
  lint_md: 'bun run lint:md'
  # Full-repo prettier check — LIVE gate since the 0.0.21 hardening session; active target 0.0.23
  # (was a documented deferred boundary per FID-001 / FID-2026-0803-001 ECHO-8;
  # now enforced with the generators emitting prettier-formatted output so
  # regenerated files stay compliant).
  format: 'bunx prettier --check .'
  clean: 'bun run --cwd=sdk clean'

paths:
  # Monorepo: no root src/ — each workspace owns its own src/ dir (common/,
  # agents/, sdk/, cli/, evals/, packages/*).
  src: null
  # NOTE: workspace tests live in per-package `src/__tests__` (Bun convention);
  # there is no top-level `tests/` dir (FID-2026-0803-001 ECHO-8).
  tests: null
  docs: 'docs/'
  dev: 'dev/'
  fids: 'dev/fids/'
  fids_archive: 'dev/fids/archive/'
  session_summaries: 'dev/session-summaries/'
  learnings: 'dev/LEARNINGS.md'

# ADVISORY — documented quality bar only. Not enforced by any lint/test gate;
# core files intentionally exceed max_file_lines (e.g. savant.ts, run.ts).
# FID-2026-0803-001 ECHO-3.
quality:
  max_file_lines: 300
  max_function_lines: 50
  max_line_length: 100
  max_complexity: 10
  max_params: 4
  max_comment_density: 0.33
  max_nesting_depth: 3

# Naming rules: see coding-standards/{language}.md

# ADVISORY — aspirational testing policy; the real gates are per-workspace
# `bun test` suites and the pre-push hook. FID-2026-0803-001 ECHO-3.
testing:
  fuzz_enabled: false
  mutation_enabled: false
  coverage_threshold: 80
  test_timeout: 30
  parallel_tests: true

# ADVISORY — documentation of the FID policy. The runtime open-FID check is
# presence-based (scanOpenFids) and `max_open_fids` is not enforced.
# FID-2026-0803-001 ECHO-3/ECHO-7.
fid:
  auto_create: true
  severity_levels: ['critical', 'high', 'medium', 'low']
  max_open_fids: 20

# Savant protocol contract — single-agent ECHO adaptation (v0.1.2-savant),
# machine-readable alongside the harness `protocol:` block (v0.2.0).
savant:
  protocol:
    version: '0.1.2-savant'
    strict_mode: true
  # ADVISORY — documents the canonical sandbox default. Actual behavior is
  # controlled by --permission-mode and /permissions in CLI state.
  # FID-2026-0803-001 ECHO-3.
  sandbox:
    permissionMode: 'prompt' # safe | prompt | unsafe

# Single-agent protocol contract (renamed from the legacy product namespace,
# FID-2026-0807-011). The runtime resolves this namespace explicitly for
# single-agent sessions; it must not fall through to the harness protocol.
single_agent:
  protocol:
    version: '0.1.2-single-agent'
    strict_mode: true

# max_iterations is LIVE: parsed by common/src/util/protocol-config.ts and
# drives the FSM circuit breaker in transition-phase.ts (FID-2026-0803-001
# ECHO-3). The remaining fields are advisory/convergence documentation.
perfection_loop:
  max_iterations: 10
  change_threshold: 0.10
  convergence_threshold: 0.02
  convergence_passes: 2
  oscillation_limit: 3

# ADVISORY — session policy documentation; not consumed by the runtime.
# FID-2026-0803-001 ECHO-3.
session:
  auto_summary: true
  summary_interval: 30
  max_session_hours: 4
  autonomy_level: 3 # 1=Guided, 2=Supervised, 3=Autonomous (default)

# Token optimization & context engineering (FID-2026-0806-003).
# All keys are optional — missing keys fall back to the defaults in
# common/src/util/protocol-config.ts. See docs/design/Token Optimization &
# Context Engineering Redesign.md §5 for the full spec.
compression:
  enabled: true
  microCompact: false # P3a — off by default (cache tradeoff)
  keepRecentTokens: 16384 # P2a — fixed verbatim recent-tail token budget
  autoCompactRatio: 0.8 # P3d — auto-compact trigger ratio
  forceCompactOffset: 15000 # P3d — force-compact trigger offset (tokens below window)
  # FID-2026-0814-004 H-06: recent tool results micro-compact preserves
  # (default 6 in the compactor).
  microCompactMaxKeepRecent: 6
  # FID-2026-0814-004 H-06: optional token floor for the micro-compact
  # pressure gate (null = no floor; never micro-compact below it).
  microCompactFloorTokens: null
  idleCompaction: # P3c — off by default
    enabled: false
    idleAfterSeconds: 1800
    floorTokens: 40000
  model: null # dedicated summarization model override (OpenClaw); null = parent model
  summary:
    requiredSections: true # P1a — structured summary contract
    exactIdentifiers: strict # P1a — exact-identifier rule

yagni:
  enforced: true # P5b — Forge yagni_check gate active
  ledger: dev/YAGNI-LEDGER.md # P5c — ponytail-debt ledger path

caveman: # P5f — telegraphic output rules (opt-in)
  enabled: false
  autoClarity: true # code blocks/paths/errors/security stay byte-exact

telemetry: # P4 — token usage + cache-hit monitoring
  enabled: true
  cacheHitAlertDrop: 0.3 # alert when cached-token ratio drops 30+ points

# ZTAP provenance (FID-2026-0813-004): mode is LIVE — parsed by
# common/src/util/protocol-config.ts and wired into every CLI run by
# cli/src/hooks/helpers/send-message-run-config.ts.
#   off     — no ledger, no signing (zero overhead)
#   record  — receipts signed + appended to .savant/provenance/ (default)
#   enforce — same as record, plus fail-closed pre-write gates in native.ts
provenance:
  mode: 'record' # off | record | enforce

# Extensible lifecycle hooks (FID-2026-0814-003): project-scoped external
# commands fired at the tool-executor lifecycle. Hooks are fail-open by default
# — only exit code 2 or a JSON `"permissionDecision": "deny"` blocks a tool.
# Events: PreToolUse | PostToolUse | PostToolUseFailure | SessionStart |
# SessionEnd | SubagentStart | SubagentStop | PreCompact | PostCompact | Stop |
# Interrupt | Notification. `matcher` (optional) is a RegExp on the tool name.
# Example:
#   hooks:
#     - event: PreToolUse
#       command: node ./hooks/audit-write.js
#       matcher: write_file|str_replace
#       timeout: 10
hooks: []
