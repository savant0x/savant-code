schema_version: '2.0'
task_id: 'release-execution'
category: 'skill_driven'
difficulty: 'medium'
description: 'Prepare a patch release across version, changelog, and README files.'
environment:
  network_disabled: true
  setup_files:
    - 'VERSION'
    - 'CHANGELOG.md'
    - 'README.md'
    - 'verify-release.mjs'
inputs:
  prompt: 'Prepare the 1.2.4 patch release using the provided fixtures.'
validation:
  timeout_seconds: 180
  deterministic_checks:
    - command: 'node verify-release.mjs'
      expected_exit_code: 0
      retry_count: 0
      retry_condition: 'infra'
