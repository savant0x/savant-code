[test]
preload = ["./src/test-setup.ts"]
# NOTE: a `[test] timeout` key here is NOT honored by bun 1.3.14 for this
# suite — proven by mutation (timeout = 1 left a 36ms test passing). Per-test
# budgets must be passed as the third argument to `test`/`it` instead, which
# the handoff matrix (CASE_TIMEOUT = 120_000) and terminal-watchdog (60_000)
# already do.

[loader]
# Tree-sitter query files are raw text, not JavaScript modules.
".scm" = "text"
