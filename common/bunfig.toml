# Test preload only (FID-2026-1007-002).
#
# `bun run --cwd=common test` runs with THIS directory as the working
# directory, and Bun does not walk up the tree for a `[test] preload` — a
# preload declared only in the root `bunfig.toml` is not loaded here. Measured
# before adding this file: with no preload, `sdk/test/setup-env.ts`'s env
# defaults were all `undefined` inside a common test, so nothing in this
# workspace was isolated between test files.
[test]
preload = ["./test/setup-test-isolation.ts"]
