<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Config command — sliders">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- slider rails -->
  <path d="M14 20 L50 20" stroke="#18faf9" stroke-width="2.5" stroke-linecap="round" />
  <path d="M14 32 L50 32" stroke="#18faf9" stroke-width="2.5" stroke-linecap="round" />
  <path d="M14 44 L50 44" stroke="#18faf9" stroke-width="2.5" stroke-linecap="round" />
  <!-- knobs -->
  <circle cx="24" cy="20" r="4" fill="#ff2bd6" filter="url(#glow)" />
  <circle cx="38" cy="32" r="4" fill="#ff2bd6" filter="url(#glow)" />
  <circle cx="28" cy="44" r="4" fill="#ff2bd6" filter="url(#glow)" />
</svg>