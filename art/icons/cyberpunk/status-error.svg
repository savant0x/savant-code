<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Error status — ringed cross">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- error ring -->
  <circle cx="32" cy="32" r="16" stroke="#18faf9" stroke-width="3" />
  <!-- cross -->
  <path d="M24 24 L40 40" stroke="#ff2bd6" stroke-width="3" stroke-linecap="round" />
  <path d="M40 24 L24 40" stroke="#ff2bd6" stroke-width="3" stroke-linecap="round" />
</svg>