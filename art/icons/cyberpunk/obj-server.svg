<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Server object — rack unit">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- rack -->
  <path d="M16 12 L48 12 L48 40 L16 40 Z" stroke="#18faf9" stroke-width="3" stroke-linejoin="round" />
  <!-- shelves -->
  <path d="M16 22 L48 22" stroke="#18faf9" stroke-width="2" />
  <path d="M16 32 L48 32" stroke="#18faf9" stroke-width="2" />
  <!-- leds -->
  <circle cx="20" cy="17" r="1.5" fill="#ff2bd6" />
  <circle cx="20" cy="27" r="1.5" fill="#18faf9" />
  <circle cx="20" cy="37" r="1.5" fill="#4fa8ff" />
  <!-- slots -->
  <path d="M30 17 L44 17" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M30 27 L44 27" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M30 37 L44 37" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" />
  <!-- stand -->
  <path d="M24 40 L24 44" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M40 40 L40 44" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M20 46 L28 46" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M36 46 L44 46" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
</svg>