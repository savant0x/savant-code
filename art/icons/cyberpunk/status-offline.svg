<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Offline status — slashed ring">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- ring -->
  <circle cx="32" cy="32" r="15" stroke="#18faf9" stroke-width="3" />
  <!-- offline slash -->
  <path d="M20 44 L44 20" stroke="#ff2bd6" stroke-width="3" stroke-linecap="round" />
  <!-- dim core -->
  <circle cx="32" cy="32" r="2" fill="#4fa8ff" opacity="0.4" />
</svg>