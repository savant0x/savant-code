<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Phase: idle — the seat doesn't ask permission">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <!-- idle: hollow core, dim frame — present, not active -->
  <circle cx="32" cy="32" r="16" stroke="#4fa8ff" stroke-width="2.5" opacity="0.8" />
  <circle cx="32" cy="32" r="7" stroke="#18faf9" stroke-width="2" opacity="0.5" />
  <!-- resting node -->
  <circle cx="32" cy="32" r="2" fill="#4fa8ff" opacity="0.7" />
  <!-- HUD tick -->
  <path d="M14 20 L10 16" stroke="#4fa8ff" stroke-width="1.5" opacity="0.5" />
</svg>