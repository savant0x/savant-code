<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Model command — stacked layers">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- top face -->
  <polygon points="32,10 48,19 32,28 16,19" stroke="#18faf9" stroke-width="3" stroke-linejoin="round" />
  <!-- left face -->
  <polygon points="16,19 32,28 32,46 16,37" stroke="#18faf9" stroke-width="3" stroke-linejoin="round" />
  <!-- right face -->
  <polygon points="48,19 32,28 32,46 48,37" stroke="#18faf9" stroke-width="3" stroke-linejoin="round" />
  <!-- inner edges -->
  <path d="M32 28 L32 46" stroke="#4fa8ff" stroke-width="1.5" />
  <path d="M16 19 L16 37" stroke="#4fa8ff" stroke-width="1.5" />
  <path d="M48 19 L48 37" stroke="#4fa8ff" stroke-width="1.5" />
  <!-- active layer node -->
  <circle cx="32" cy="19" r="2.5" fill="#ff2bd6" filter="url(#glow)" />
</svg>