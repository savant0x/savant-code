<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  fill="none"
  role="img"
  aria-label="Scan motif — corner brackets with sweep"
>
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- corner brackets -->
  <path
    d="M12 16 L12 12 L16 12"
    stroke="#18faf9"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M52 12 L56 12 L56 16"
    stroke="#18faf9"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M56 52 L56 56 L52 56"
    stroke="#18faf9"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M16 56 L12 56 L12 52"
    stroke="#18faf9"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- scan line -->
  <path
    d="M16 32 L48 32"
    stroke="#ff2bd6"
    stroke-width="3"
    stroke-linecap="round"
    filter="url(#glow)"
  />
  <!-- end nodes -->
  <circle cx="16" cy="32" r="2" fill="#ff2bd6" />
  <circle cx="48" cy="32" r="2" fill="#ff2bd6" />
  <!-- faint sweeps -->
  <path
    d="M16 24 L48 24"
    stroke="#4fa8ff"
    stroke-width="1"
    opacity="0.4"
    stroke-linecap="round"
  />
  <path
    d="M16 40 L48 40"
    stroke="#4fa8ff"
    stroke-width="1"
    opacity="0.4"
    stroke-linecap="round"
  />
</svg>
