<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Graph command — triangle of nodes">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- edges -->
  <path d="M32 16 L48 42" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M48 42 L16 42" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M16 42 L32 16" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <!-- nodes -->
  <circle cx="32" cy="16" r="4" fill="#18faf9" />
  <circle cx="48" cy="42" r="4" fill="#18faf9" />
  <circle cx="16" cy="42" r="4" fill="#18faf9" />
  <!-- hub -->
  <circle cx="32" cy="33" r="2.5" fill="#ff2bd6" filter="url(#glow)" />
</svg>