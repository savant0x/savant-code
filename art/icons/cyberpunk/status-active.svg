<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Active status — pulsing core">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- active core -->
  <circle cx="32" cy="32" r="5" fill="#ff2bd6" filter="url(#glow)" />
  <!-- activity ring -->
  <circle cx="32" cy="32" r="13" stroke="#18faf9" stroke-width="3" />
  <!-- cardinal ticks -->
  <path d="M32 12 L32 17" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M32 47 L32 52" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M12 32 L17 32" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M47 32 L52 32" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
</svg>