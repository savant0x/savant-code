<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Pulse motif — heartbeat line">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- pulse line -->
  <path d="M10 32 L22 32 L28 20 L36 44 L42 32 L54 32" stroke="#18faf9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- end nodes -->
  <circle cx="10" cy="32" r="2" fill="#ff2bd6" />
  <circle cx="54" cy="32" r="2" fill="#ff2bd6" />
</svg>