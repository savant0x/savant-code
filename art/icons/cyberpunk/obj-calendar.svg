<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Calendar object — month grid">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- page -->
  <path d="M14 18 L50 18 L50 50 L14 50 Z" stroke="#18faf9" stroke-width="3" stroke-linejoin="round" />
  <!-- header -->
  <path d="M14 26 L50 26" stroke="#18faf9" stroke-width="2" />
  <!-- rings -->
  <path d="M22 12 L22 20" stroke="#18faf9" stroke-width="3" stroke-linecap="round" />
  <path d="M42 12 L42 20" stroke="#18faf9" stroke-width="3" stroke-linecap="round" />
  <!-- day dots -->
  <circle cx="22" cy="34" r="1.6" fill="#18faf9" />
  <circle cx="30" cy="34" r="1.6" fill="#18faf9" />
  <circle cx="38" cy="34" r="1.6" fill="#18faf9" />
  <circle cx="22" cy="42" r="1.6" fill="#18faf9" />
  <circle cx="30" cy="42" r="1.6" fill="#18faf9" />
  <circle cx="38" cy="42" r="1.6" fill="#ff2bd6" filter="url(#glow)" />
</svg>