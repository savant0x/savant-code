<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Tag object — rotated square">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- tag body (diamond) -->
  <rect x="20" y="20" width="24" height="24" rx="4" transform="rotate(45 32 32)" stroke="#18faf9" stroke-width="3" />
  <!-- hole -->
  <circle cx="32" cy="32" r="3" stroke="#ff2bd6" stroke-width="2" />
  <!-- string -->
  <path d="M46 14 L52 8" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <circle cx="53" cy="7" r="1.5" fill="#4fa8ff" />
</svg>