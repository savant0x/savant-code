<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Audit — double-audit verification">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- HUD corner brackets -->
  <g stroke="#18faf9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 18 L10 10 L18 10" />
    <path d="M46 10 L54 10 L54 18" />
    <path d="M54 46 L54 54 L46 54" />
    <path d="M18 54 L10 54 L10 46" />
  </g>
  <!-- verification check with terminal nodes -->
  <path d="M22 33 L29 39 L43 23" stroke="#ff2bd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <g fill="#ff2bd6">
    <circle cx="22" cy="33" r="2" />
    <circle cx="43" cy="23" r="2" />
  </g>
  <!-- scanline sweep -->
  <path d="M16 47 L48 47" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.5" />
</svg>
