<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Scribe — ECHO agent role: documentation synthesis">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- pen nib -->
  <polygon points="32,8 43,21 38,38 32,46 26,38 21,21" stroke="#18faf9" stroke-width="3" stroke-linejoin="round" fill="#18faf9" fill-opacity="0.08" />
