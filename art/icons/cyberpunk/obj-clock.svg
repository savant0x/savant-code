<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Clock object — analog clock">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- face -->
  <circle cx="32" cy="32" r="18" stroke="#18faf9" stroke-width="3" />
  <!-- hour hand -->
  <path d="M32 32 L32 20" stroke="#18faf9" stroke-width="3" stroke-linecap="round" />
  <!-- minute hand -->
  <path d="M32 32 L41 37" stroke="#ff2bd6" stroke-width="2.5" stroke-linecap="round" />
  <!-- hub -->
  <circle cx="32" cy="32" r="2" fill="#ff2bd6" />
  <!-- tick marks -->
  <path d="M32 16 L32 19" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M48 32 L45 32" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M32 48 L32 45" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M16 32 L19 32" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" />
</svg>