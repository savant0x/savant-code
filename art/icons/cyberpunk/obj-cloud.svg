<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Cloud object — cloud with rain">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- cloud -->
  <path d="M18 44 L46 44 C52 44 54 38 50 34 C50 27 44 23 38 25 C36 17 26 15 22 21 C15 21 11 29 15 34 C12 38 13 44 18 44 Z" stroke="#18faf9" stroke-width="3" stroke-linejoin="round" />
  <!-- core node -->
  <circle cx="32" cy="34" r="2" fill="#ff2bd6" />
  <!-- rain -->
  <path d="M24 50 L22 54" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M32 50 L32 54" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M40 50 L42 54" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" />
</svg>