<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Connecting status — plug and cable">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- plug prongs -->
  <path d="M24 12 L24 24" stroke="#18faf9" stroke-width="3" stroke-linecap="round" />
  <path d="M40 12 L40 24" stroke="#18faf9" stroke-width="3" stroke-linecap="round" />
  <!-- plug body -->
  <path d="M20 24 L44 24 L44 34 L20 34 Z" stroke="#18faf9" stroke-width="3" stroke-linejoin="round" />
  <!-- cable -->
  <path d="M32 34 L32 44 L26 50" stroke="#18faf9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="24" cy="52" r="2" fill="#ff2bd6" />
</svg>