<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  fill="none"
  role="img"
  aria-label="Lint tool — broom sweeping"
>
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- handle -->
  <path
    d="M40 12 L30 30"
    stroke="#18faf9"
    stroke-width="3"
    stroke-linecap="round"
  />
  <!-- broom head -->
  <polygon
    points="22,34 38,34 34,46 26,46"
    stroke="#18faf9"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <!-- bristles -->
  <path
    d="M26 36 L27 44"
    stroke="#4fa8ff"
    stroke-width="1.5"
    stroke-linecap="round"
  />
  <path
    d="M32 36 L32 44"
    stroke="#4fa8ff"
    stroke-width="1.5"
    stroke-linecap="round"
  />
  <path
    d="M38 36 L37 44"
    stroke="#4fa8ff"
    stroke-width="1.5"
    stroke-linecap="round"
  />
  <!-- sweep ticks -->
  <path
    d="M16 40 L12 40"
    stroke="#ff2bd6"
    stroke-width="2"
    stroke-linecap="round"
  />
  <path
    d="M14 46 L9 46"
    stroke="#ff2bd6"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>
