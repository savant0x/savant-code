<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Blocked status — octagon with bar">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- stop octagon -->
  <path d="M20 12 L44 12 L52 20 L52 44 L44 52 L20 52 L12 44 L12 20 Z" stroke="#18faf9" stroke-width="3" stroke-linejoin="round" />
  <!-- block bar -->
  <path d="M22 32 L42 32" stroke="#ff2bd6" stroke-width="3" stroke-linecap="round" />
</svg>