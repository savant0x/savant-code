<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Researcher — ECHO agent role: external verification flask">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- flask: neck, shoulder, cone body -->
  <path d="M28 8 L36 8 L36 21 L49 46 L15 46 L28 21 Z" stroke="#18faf9" stroke-width="3" stroke-linejoin="round" />
  <!-- neon liquid -->
  <polygon points="22,38 42,38 47,46 17,46" fill="#18faf9" opacity="0.12" />
  <path d="M22 38 L42 38" stroke="#ff2bd6" stroke-width="2" stroke-linecap="round" />
  <!-- rising bubbles -->
  <g fill="#18faf9">
    <circle cx="28" cy="42" r="1.5" />
    <circle cx="36" cy="40" r="2" />
    <circle cx="40" cy="44" r="1" />
  </g>
  <!-- circuit trace off the flask base -->
  <path d="M32 46 L32 52 L37 52" stroke="#18faf9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="39.5" cy="52" r="1.8" fill="#ff2bd6" filter="url(#glow)" />
</svg>
