<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Voxel motif — isometric cube">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- top face -->
  <polygon points="32,12 48,21 32,30 16,21" stroke="#18faf9" stroke-width="3" stroke-linejoin="round" />
  <!-- left face -->
  <polygon points="16,21 32,30 32,48 16,39" stroke="#18faf9" stroke-width="3" stroke-linejoin="round" />
  <!-- right face -->
  <polygon points="48,21 32,30 32,48 48,39" stroke="#4fa8ff" stroke-width="2.5" stroke-linejoin="round" />
  <!-- inner edges -->
  <path d="M32 30 L32 48" stroke="#4fa8ff" stroke-width="1.5" />
  <path d="M16 21 L16 39" stroke="#4fa8ff" stroke-width="1.5" />
  <path d="M48 21 L48 39" stroke="#4fa8ff" stroke-width="1.5" />
  <!-- core -->
  <circle cx="32" cy="30" r="2" fill="#ff2bd6" filter="url(#glow)" />
</svg>