<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="SELF-CORRECT phase — revising the approach">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- the old approach: dashed circle being revised -->
  <circle cx="32" cy="32" r="18" stroke="#18faf9" stroke-width="2" stroke-dasharray="4 3" opacity="0.7" />
  <!-- pencil redrawing it -->
  <path d="M44 40 L52 48" stroke="#18faf9" stroke-width="4" stroke-linecap="round" />
  <polygon points="41,43 37,47 45,49" fill="#ff2bd6" filter="url(#glow)" />
  <path d="M52 48 L56 44" stroke="#ff2bd6" stroke-width="3" stroke-linecap="round" />
  <!-- revision spark where pencil meets the circle -->
  <circle cx="44.5" cy="44.5" r="1.5" fill="#ff2bd6" />
</svg>
