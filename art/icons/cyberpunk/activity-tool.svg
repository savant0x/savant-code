<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Activity: tool — tool execution in the sandbox">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <!-- tool: the sandbox gear — circuit-trace gear, not a stock cog -->
  <circle cx="32" cy="32" r="12" stroke="#18faf9" stroke-width="3" />
  <!-- gear teeth as circuit stubs -->
  <g stroke="#18faf9" stroke-width="3" stroke-linecap="round">
    <path d="M32 16 L32 10" /><path d="M48 32 L54 32" /><path d="M32 48 L32 54" /><path d="M16 32 L10 32" />
    <path d="M43 16 L47 10" /><path d="M43 48 L47 54" /><path d="M21 48 L17 54" /><path d="M21 16 L17 10" />
  </g>
  <!-- the executing core -->
  <circle cx="32" cy="32" r="4" fill="#ff2bd6" filter="url(#glow)" />
</svg>