<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Fetch tool — download arrow onto a tray">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- tray -->
  <path d="M14 36 L50 36 L50 52 L14 52 Z" stroke="#18faf9" stroke-width="3" stroke-linejoin="round" />
  <!-- fetch arrow -->
  <path d="M32 12 L32 30" stroke="#18faf9" stroke-width="3" stroke-linecap="round" />
  <polygon points="26,24 32,31 38,24" fill="#ff2bd6" filter="url(#glow)" />
  <!-- side ticks -->
  <path d="M18 14 L18 20" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M46 14 L46 20" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" />
</svg>