<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  fill="none"
  role="img"
  aria-label="Node motif — hub and satellites"
>
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- center hub -->
  <circle cx="32" cy="32" r="5" fill="#ff2bd6" filter="url(#glow)" />
  <!-- spokes -->
  <path
    d="M32 32 L32 14"
    stroke="#18faf9"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <path
    d="M32 32 L50 32"
    stroke="#18faf9"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <path
    d="M32 32 L32 50"
    stroke="#18faf9"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <path
    d="M32 32 L14 32"
    stroke="#18faf9"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <!-- satellites -->
  <circle cx="32" cy="12" r="3" fill="#18faf9" />
  <circle cx="52" cy="32" r="3" fill="#18faf9" />
  <circle cx="32" cy="52" r="3" fill="#18faf9" />
  <circle cx="12" cy="32" r="3" fill="#18faf9" />
  <!-- diagonal links -->
  <path
    d="M20 20 L26 26"
    stroke="#4fa8ff"
    stroke-width="1.5"
    stroke-linecap="round"
  />
  <path
    d="M44 20 L38 26"
    stroke="#4fa8ff"
    stroke-width="1.5"
    stroke-linecap="round"
  />
  <path
    d="M44 44 L38 38"
    stroke="#4fa8ff"
    stroke-width="1.5"
    stroke-linecap="round"
  />
  <path
    d="M20 44 L26 38"
    stroke="#4fa8ff"
    stroke-width="1.5"
    stroke-linecap="round"
  />
</svg>
