<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Code object — angle brackets with slash">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- left bracket -->
  <path d="M24 20 L12 32 L24 44" stroke="#18faf9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- right bracket -->
  <path d="M40 20 L52 32 L40 44" stroke="#18faf9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- code slash -->
  <path d="M34 16 L30 48" stroke="#ff2bd6" stroke-width="2.5" stroke-linecap="round" />
  <!-- end nodes -->
  <circle cx="12" cy="32" r="2" fill="#ff2bd6" />
  <circle cx="52" cy="32" r="2" fill="#ff2bd6" />
</svg>