<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Glob tool — orbital spokes">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- six pattern spokes radiating from hub -->
  <path d="M32 32 L46 32" stroke="#18faf9" stroke-width="3" stroke-linecap="round" />
  <path d="M32 32 L39 44" stroke="#18faf9" stroke-width="3" stroke-linecap="round" />
  <path d="M32 32 L25 44" stroke="#18faf9" stroke-width="3" stroke-linecap="round" />
  <path d="M32 32 L18 32" stroke="#18faf9" stroke-width="3" stroke-linecap="round" />
  <path d="M32 32 L25 20" stroke="#18faf9" stroke-width="3" stroke-linecap="round" />
  <path d="M32 32 L39 20" stroke="#18faf9" stroke-width="3" stroke-linecap="round" />
  <!-- orbit ring -->
  <circle cx="32" cy="32" r="20" stroke="#4fa8ff" stroke-width="1.5" stroke-dasharray="4 5" />
  <!-- orbiting dot -->
  <circle cx="32" cy="12" r="2.5" fill="#ff2bd6" filter="url(#glow)" />
</svg>