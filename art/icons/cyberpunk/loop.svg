<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Perfection Loop — the ECHO fix/verify cycle">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- 270-degree cycle arc -->
  <path d="M32 12 A20 20 0 1 1 12 32" stroke="#18faf9" stroke-width="3" stroke-linecap="round" />
  <!-- arrowhead at the arc terminus -->
  <polygon points="8,26 16,26 12,34" fill="#ff2bd6" filter="url(#glow)" />
  <!-- phase nodes on the arc -->
  <g>
    <circle cx="52" cy="32" r="2.5" fill="#18faf9" />
    <circle cx="46" cy="46" r="2.5" fill="#ff2bd6" />
    <circle cx="32" cy="52" r="2.5" fill="#4fa8ff" />
    <circle cx="18" cy="46" r="2.5" fill="#18faf9" />
  </g>
  <!-- loop core -->
  <polygon points="32,26 38,32 32,38 26,32" stroke="#ff2bd6" stroke-width="2" stroke-linejoin="round" filter="url(#glow)" />
</svg>
