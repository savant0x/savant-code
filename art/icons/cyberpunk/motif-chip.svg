<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Chip motif — microprocessor">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- body -->
  <rect x="18" y="18" width="28" height="28" rx="4" stroke="#18faf9" stroke-width="3" />
  <!-- inner die -->
  <rect x="26" y="26" width="12" height="12" stroke="#ff2bd6" stroke-width="2" />
  <!-- top pins -->
  <path d="M24 10 L24 18" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M32 10 L32 18" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M40 10 L40 18" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <!-- bottom pins -->
  <path d="M24 50 L24 58" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M32 50 L32 58" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M40 50 L40 58" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <!-- left pins -->
  <path d="M10 24 L18 24" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M10 32 L18 32" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M10 40 L18 40" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <!-- right pins -->
  <path d="M50 24 L58 24" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M50 32 L58 32" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
  <path d="M50 40 L58 40" stroke="#18faf9" stroke-width="2" stroke-linecap="round" />
</svg>