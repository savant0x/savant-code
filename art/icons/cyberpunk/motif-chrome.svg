<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Chrome motif — stacked chevrons">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- chevron one -->
  <path d="M16 20 L32 10 L48 20" stroke="#18faf9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- chevron two -->
  <path d="M16 30 L32 20 L48 30" stroke="#18faf9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- chevron three -->
  <path d="M16 40 L32 30 L48 40" stroke="#4fa8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- base rail -->
  <path d="M20 50 L44 50" stroke="#ff2bd6" stroke-width="2" stroke-linecap="round" />
  <!-- rail nodes -->
  <circle cx="20" cy="50" r="2" fill="#ff2bd6" />
  <circle cx="44" cy="50" r="2" fill="#ff2bd6" />
</svg>