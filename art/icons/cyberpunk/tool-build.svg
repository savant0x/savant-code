    stroke="#18faf9"
    stroke-width="3"
    stroke-linecap="round"
  />
  <path
    d="M14 32 L20 32"
    stroke="#18faf9"
    stroke-width="3"
    stroke-linecap="round"
  />
  <path
    d="M44 32 L50 32"
    stroke="#18faf9"
    stroke-width="3"
    stroke-linecap="round"
  />
  <path
    d="M19 19 L23 23"
    stroke="#18faf9"
    stroke-width="3"
    stroke-linecap="round"
  />
  <path
    d="M41 41 L45 45"
    stroke="#18faf9"
    stroke-width="3"
    stroke-linecap="round"
  />
  <path
    d="M45 19 L41 23"
    stroke="#18faf9"
    stroke-width="3"
    stroke-linecap="round"
  />
  <path
    d="M23 41 L19 45"
