<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Diff tool — two documents with spark">
  <!-- SAVANT // CYBERDECK — hand-authored vector geometry, no external assets -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- left document (removed) -->
  <path d="M16 14 L28 14 L28 50 L16 50 Z" stroke="#18faf9" stroke-width="3" stroke-linejoin="round" />
  <!-- right document (added) -->
  <path d="M36 14 L48 14 L48 50 L36 50 Z" stroke="#4fa8ff" stroke-width="3" stroke-linejoin="round" />
  <!-- central spark -->
  <path d="M32 24 L32 40" stroke="#ff2bd6" stroke-width="2" stroke-linecap="round" />
  <circle cx="32" cy="20" r="1.5" fill="#ff2bd6" />
  <circle cx="32" cy="44" r="1.5" fill="#ff2bd6" />
  <!-- inner lines -->
  <path d="M20 22 L24 22" stroke="#18faf9" stroke-width="1.5" stroke-linecap="round" />
  <path d="M20 28 L24 28" stroke="#18faf9" stroke-width="1.5" stroke-linecap="round" />
  <path d="M40 22 L44 22" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M40 28 L44 28" stroke="#4fa8ff" stroke-width="1.5" stroke-linecap="round" />
</svg>