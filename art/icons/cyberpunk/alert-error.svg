<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Alert: error — a failure, named">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <!-- error: octagon frame (hard stop, not a soft circle) -->
  <polygon points="24,12 40,12 52,24 52,40 40,52 24,52 12,40 12,24" stroke="#ff2bd6" stroke-width="3" stroke-linejoin="round" />
  <!-- the X: two crossing circuit traces -->
  <path d="M24 24 L40 40" stroke="#ff2bd6" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M40 24 L24 40" stroke="#ff2bd6" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
  <!-- terminal nodes at the X's ends -->
  <g fill="#ff2bd6" opacity="0.8">
    <circle cx="24" cy="24" r="1.5" /><circle cx="40" cy="24" r="1.5" />
    <circle cx="40" cy="40" r="1.5" /><circle cx="24" cy="40" r="1.5" />
  </g>
</svg>